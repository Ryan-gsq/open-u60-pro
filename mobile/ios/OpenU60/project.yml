name: OpenU60

options:
  bundleIdPrefix: com.jesthersilvestre.openu60
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true

settings:
  base:
    # Language mode, independent of the Swift compiler bundled with Xcode.
    SWIFT_VERSION: "5.0"

targets:
  OpenU60:
    type: application
    platform: iOS
    sources:
      - path: OpenU60App.swift
      - path: Core
      - path: Features
      - path: Navigation
      - path: Resources
      - path: Shared
    dependencies:
      - sdk: CoreBluetooth.framework
      - target: SignalLiveActivityExtension
    entitlements:
      path: Resources/OpenU60.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesthersilvestre.openu60
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SignalLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivityExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesthersilvestre.openu60.liveactivity
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: OpenU60 Signal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  OpenU60:
    build:
      targets:
        OpenU60: all
    run:
      config: Debug
    archive:
      config: Release
